[project]
name = "qloverleaf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "b1tw153", email = "b.tw153@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "python-multipart>=0.0.27",
    "starlette>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "uvicorn>=0.34.0",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]    # pycodestyle, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real network calls; skipped by default (pass --live to run)",
]
